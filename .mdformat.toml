# mdformat settings, applied by the pre-commit hook.
# 120 rather than 80: prose reflows to the width editors and review diffs
# actually use, and the formatter owns wrapping so nobody hand-wraps again.
wrap = 120
# Number ordered lists consecutively. The alternative writes every item as
# `1.`, which renders the same but makes a procedure hard to follow in the
# source and impossible to cite a step of.
number = true
end_of_line = "lf"
