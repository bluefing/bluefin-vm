name: Build ARM64 Bluefin VM image

# Builds the distribution artifact on a native aarch64 runner: the derived VM
# image (image/Containerfile) layered on the upstream Bluefin container, then
# a bootable disk from it. The same scripts run locally -- CI is just the
# automated invocation of ./bin/build-image.sh + ./bin/build-disk.sh.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Source bootc container image (must be an arm64 build)
        default: ghcr.io/ublue-os/bluefin:lts-testing-50-arm64
        type: string
      format:
        description: Output format
        default: raw
        type: choice
        options: [raw, qcow2, iso, vmdk]
      patched:
        description: Layer image/Containerfile onto the source image first
        default: true
        type: boolean
      publish:
        description: Publish the disk image to R2 (raw + patched builds only)
        default: true
        type: boolean
  # Uncomment to rebuild weekly so the artifact tracks upstream:
  # schedule:
  #   - cron: '0 6 * * 1'

jobs:
  build:
    # Native ARM64 hosted runner -> no CPU emulation, no cross-arch caveats.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      IMAGE: ${{ github.event.inputs.image || 'ghcr.io/ublue-os/bluefin:lts-testing-50-arm64' }}
      FORMAT: ${{ github.event.inputs.format || 'raw' }}
      PATCHED: ${{ github.event.inputs.patched || 'true' }}
      PUBLISH: ${{ github.event.inputs.publish || 'true' }}
      PATCHED_TAG: localhost/bluefin-vm-patched:ci
    steps:
      - uses: actions/checkout@v4

      - name: Show host arch (sanity check)
        run: uname -m   # expect: aarch64

      # Short commit for a self-describing, collision-free artefact name.
      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Both scripts auto-select Podman on Linux; rootful storage needs sudo.
      - name: Build the derived image
        if: env.PATCHED == 'true'
        run: |
          sudo podman pull "$IMAGE"
          sudo ./bin/build-image.sh -t "$PATCHED_TAG" -b "$IMAGE"

      - name: Build the disk
        run: |
          if [ "$PATCHED" = "true" ]; then
            sudo ./bin/build-disk.sh -f "$FORMAT" -i "$PATCHED_TAG"
          else
            sudo ./bin/build-disk.sh -f "$FORMAT" -i "$IMAGE"
          fi

      - name: Restore ownership of output
        run: sudo chown -R "$(id -u):$(id -g)" output

      - name: List artifacts
        run: ls -lhR output

      # Disabled for now: R2 (the "Publish disk image to R2" step below) is the
      # distribution while we prove it out. The GitHub artefact duplicates that
      # image and counts against Actions storage, so it's off -- re-enable or
      # remove once R2 is confirmed working end to end.
      - name: Upload image
        if: false
        uses: actions/upload-artifact@v4
        with:
          # <format>-arm64-<patched|stock>-<ref>-<shortsha>: self-describing and
          # collision-free. This is the GitHub artefact label only -- the files
          # inside stay disk.raw, and the R2/tool URL is a separate stable name.
          name: bluefin-vm-${{ env.FORMAT }}-arm64-${{ env.PATCHED == 'true' && 'patched' || 'stock' }}-${{ github.ref_name }}-${{ steps.vars.outputs.sha }}
          path: output/**
          if-no-files-found: error
          # Disk images are multi-GB; keep retention short.
          retention-days: 7

      # Publish the disk image to R2 so `bluefin-vm up` can download it, under a
      # stable name (the versioned artifact above is separate). Only for the raw
      # + patched disk -- the shape the CLI expects (image/disk.raw with the
      # first-boot provisioner). Zip the same output/ contents the CI artifact
      # has -- image/disk.raw (what the extractor reads) plus manifest-raw.json --
      # so the published image mirrors the build. Cache-Control: no-cache so
      # Cloudflare revalidates by ETag -- a fresh build is served immediately, no
      # cache-purge token needed. Secrets/config all via env, quoted in run.
      - name: Publish disk image to R2
        if: env.PUBLISH == 'true' && env.FORMAT == 'raw' && env.PATCHED == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: bluefin-vm-disks
          DISK_IMAGE: bluefin-vm-raw-arm64.zip
        run: |
          set -euo pipefail
          ( cd output && zip -r "../$DISK_IMAGE" image manifest-raw.json )
          sha256sum "$DISK_IMAGE" | awk '{print $1}' > "$DISK_IMAGE.sha256"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$DISK_IMAGE" "s3://$BUCKET/$DISK_IMAGE" \
            --endpoint-url "$endpoint" \
            --content-type application/zip \
            --cache-control no-cache
          aws s3 cp "$DISK_IMAGE.sha256" "s3://$BUCKET/$DISK_IMAGE.sha256" \
            --endpoint-url "$endpoint" \
            --content-type text/plain \
            --cache-control no-cache
          echo "Published https://disks.bluefing.net/$DISK_IMAGE (sha256 $(cat "$DISK_IMAGE.sha256"))"
