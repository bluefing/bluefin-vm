name: CI

# The same gate the local hooks run, but authoritative: it can't be bypassed
# with `--no-verify` or skipped by a rebase. Runs the full pre-commit suite on
# every push and PR. Every layer is pinned so CI and local are identical:
# mise.toml holds the runner tools (just, bats, pre-commit, ...), pre-commit's
# hook envs hold the linters, and rust-toolchain.toml holds Rust.
# Arch-independent; only the image build needs an ARM runner.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned runner tools from mise.toml -- the same set `mise install`
      # gives a dev machine, so there is no version skew at this layer either.
      - name: Install the pinned project tooling
        uses: jdx/mise-action@v2

      # The hook environments are rebuilt only when the config changes;
      # otherwise they come from cache. That speeds the gate up and stops a
      # flaky binary download (shellcheck/shfmt/hadolint/pyright fetch theirs
      # at env-install time) from failing an unrelated run.
      - name: Cache the pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run the pre-commit gate
        run: pre-commit run --all-files --show-diff-on-failure
