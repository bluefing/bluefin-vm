[package]
name = "bluefin-vm"
version = "0.1.0"
edition = "2021"
description = "Download, import, and run a Bluefin VM on Apple Silicon"
license = "Apache-2.0"

[[bin]]
name = "bluefin-vm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ureq = "3"
sha2 = "0.11"
indicatif = "0.18"
# Seed is a zip64 archive (the disk entry is >4 GiB) compressed with deflate;
# no other codec/crypto features needed, so keep the default set out.
zip = { version = "2", default-features = false, features = ["deflate"] }
