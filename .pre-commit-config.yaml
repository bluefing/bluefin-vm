# Install the git hook:   pre-commit install
# Run against everything:  pre-commit run --all-files
# Skip once (emergency):   git commit --no-verify
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-yaml            # validates the GitHub Actions workflow
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: ["--maxkb=1024"]     # keep multi-GB images/bundles out of git

  # Shell linting/formatting via the already-installed system tools.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -S warning
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -ci -w
        language: system
        types: [shell]

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: (^|/)Containerfile$

      - id: tests
        name: bats test suite
        entry: bats tests
        language: system
        pass_filenames: false
        always_run: true
