# Install the hooks:      pre-commit install   (pre-commit + commit-msg + pre-push)
# Run against everything:  pre-commit run --all-files
# Skip once (emergency):   git commit --no-verify
minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Hooks run at commit unless they opt into more. The non-mutating validators
# also run at pre-push as a backstop -- a rebase or `--no-verify` skips the
# commit-time run, and pre-push catches it before it reaches the remote. The
# fixers stay commit-only, so a push never mutates the working tree.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
        stages: [pre-commit, pre-push]   # rebases can leave markers behind
      - id: check-yaml            # validates the GitHub Actions workflow
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: ["--maxkb=1024"]     # keep multi-GB images/bundles out of git
        stages: [pre-commit, pre-push]

  # Shell linting/formatting via the already-installed system tools.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -S warning
        language: system
        types: [shell]
        stages: [pre-commit, pre-push]

      - id: shfmt
        name: shfmt
        entry: shfmt -i 2 -ci -w
        language: system
        types: [shell]

      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        files: (^|/)Containerfile$
        stages: [pre-commit, pre-push]

      - id: tests
        name: bats test suite
        entry: bats tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      # Rust gate for the cli crate -- runs `just cli check` (fmt, clippy,
      # test). always_run so it can't be silently skipped by file matching;
      # cargo is incremental, so it's cheap when nothing changed.
      - id: rust
        name: rust (just cli check)
        entry: just cli check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  # --- Commit message format (conventional commits) ---
  # commitlint: rules in .commitlintrc.yaml extend
  # @commitlint/config-conventional with header-max-length: 80 and
  # subject-min-length: 5.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.25.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
